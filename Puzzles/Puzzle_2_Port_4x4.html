<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle Edu-Centre — Port</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f1ed;color:#302431;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:22px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.5}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px;background:#762f4a;color:white}button:focus-visible{outline:4px solid #edac25;outline-offset:2px}.layout{display:grid;grid-template-columns:minmax(260px,600px) minmax(150px,240px);gap:24px}#board{display:grid;grid-template-columns:repeat(4,1fr);aspect-ratio:1;gap:2px;background:#fff;border:4px solid #fff;box-shadow:0 4px 20px #0002}.piece{padding:0;border-radius:0;background-color:transparent;background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgNjAwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjYwMCIgZmlsbD0iI2JjZTRmMyIvPjxjaXJjbGUgY3g9IjQ4MCIgY3k9IjEwMCIgcj0iNDgiIGZpbGw9IiNmZmJkNTkiLz48cGF0aCBkPSJNMCAzNjBRMTAwIDMyMCAyMDAgMzYwVDQwMCAzNjBUNjAwIDM2MFY2MDBIMCIgZmlsbD0iIzMyOGZiYSIvPjxwYXRoIGQ9Ik03MCA0MDVIMzEwTDI2MCA0NjBIMTE1WiIgZmlsbD0iI2E0NDM1NSIvPjxwYXRoIGQ9Ik0xODUgMTYwVjQwNSIgc3Ryb2tlPSIjNDQzZjU1IiBzdHJva2Utd2lkdGg9IjEyIi8+PHBhdGggZD0iTTE3NCAxODBMMTc0IDM3NUg2NVoiIGZpbGw9IiNmZmY0ZGQiLz48cGF0aCBkPSJNMTk4IDIxNUwyOTAgMzc1SDE5OFoiIGZpbGw9IiNmNWI2NmEiLz48cGF0aCBkPSJNNDIwIDE1MEg0ODBWMzcwSDQyMFoiIGZpbGw9IiNmZmYxZGYiLz48cGF0aCBkPSJNNDIwIDIzMEg0ODBWMjY1SDQyMFpNNDIwIDMxMEg0ODBWMzQwSDQyMFoiIGZpbGw9IiNjNjRhNTgiLz48cGF0aCBkPSJNNDEwIDE1MEw0NTAgMTAwIDQ5MCAxNTBaIiBmaWxsPSIjNDI0YjY4Ii8+PHBhdGggZD0iTTM4MCAzODBMNTIwIDM3MCA1ODAgNDE1IDM2NSA0MTVaIiBmaWxsPSIjNjU2OTc4Ii8+PC9zdmc+');background-size:400% 400%;touch-action:none;aspect-ratio:1}.piece.selected{outline:4px solid #ffd049;outline-offset:-4px}.piece.over{opacity:.5}img{width:100%;border-radius:8px}#message{font-weight:bold;color:#286d4c;min-height:28px}@media(max-width:640px){.layout{grid-template-columns:1fr}aside{max-width:200px}} </style><main><h1>Edu-Centre · Port</h1><div>4×4 · 16 morceaux · Intermédiaire</div><p>Glisse un morceau sur un autre pour les échanger. Tu peux aussi cliquer sur deux morceaux, ou utiliser Tab et Entrée.</p><div class="tools"><button id="shuffle">Mélanger</button><button id="model" aria-expanded="true">Masquer le modèle</button><span id="stats"></span></div><div class="layout"><div id="board" aria-label="Puzzle"></div><aside><div id="preview"><p>Image à reconstruire</p><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgNjAwIj48cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjYwMCIgZmlsbD0iI2JjZTRmMyIvPjxjaXJjbGUgY3g9IjQ4MCIgY3k9IjEwMCIgcj0iNDgiIGZpbGw9IiNmZmJkNTkiLz48cGF0aCBkPSJNMCAzNjBRMTAwIDMyMCAyMDAgMzYwVDQwMCAzNjBUNjAwIDM2MFY2MDBIMCIgZmlsbD0iIzMyOGZiYSIvPjxwYXRoIGQ9Ik03MCA0MDVIMzEwTDI2MCA0NjBIMTE1WiIgZmlsbD0iI2E0NDM1NSIvPjxwYXRoIGQ9Ik0xODUgMTYwVjQwNSIgc3Ryb2tlPSIjNDQzZjU1IiBzdHJva2Utd2lkdGg9IjEyIi8+PHBhdGggZD0iTTE3NCAxODBMMTc0IDM3NUg2NVoiIGZpbGw9IiNmZmY0ZGQiLz48cGF0aCBkPSJNMTk4IDIxNUwyOTAgMzc1SDE5OFoiIGZpbGw9IiNmNWI2NmEiLz48cGF0aCBkPSJNNDIwIDE1MEg0ODBWMzcwSDQyMFoiIGZpbGw9IiNmZmYxZGYiLz48cGF0aCBkPSJNNDIwIDIzMEg0ODBWMjY1SDQyMFpNNDIwIDMxMEg0ODBWMzQwSDQyMFoiIGZpbGw9IiNjNjRhNTgiLz48cGF0aCBkPSJNNDEwIDE1MEw0NTAgMTAwIDQ5MCAxNTBaIiBmaWxsPSIjNDI0YjY4Ii8+PHBhdGggZD0iTTM4MCAzODBMNTIwIDM3MCA1ODAgNDE1IDM2NSA0MTVaIiBmaWxsPSIjNjU2OTc4Ii8+PC9zdmc+" alt="Port"></div><p>Chaque progrès est une réussite !</p></aside></div><p id="message" role="status" aria-live="polite"></p></main><script>
const n=4,board=document.getElementById('board'),stats=document.getElementById('stats'),message=document.getElementById('message');let order=[],selected=null,source=null,moves=0,start=null,done=false;const buttons=[];
for(let i=0;i<n*n;i++){let b=document.createElement('button');b.class4ame='piece';b.draggable=true;board.appendChild(b);buttons.push(b);b.addEventListener('click',()=>{if(done)return;if(selected===null){selected=i;render()}else if(selected===i){selected=null;render()}else{swap(selected,i)}});b.addEventListener('dragstart',e=>{if(done){e.preventDefault();return}source=i;selected=null;e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('over')});b.addEventListener('dragleave',()=>b.classList.remove('over'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('over');if(source!==null&&!done)swap(source,i);source=null});b.addEventListener('dragend',()=>{source=null;buttons.forEach(x=>x.classList.remove('over'))})}
function render(){buttons.forEach((b,i)=>{let t=order[i];b.style.backgroundPosition=(t%n)*100/(n-1)+'% '+Math.floor(t/n)*100/(n-1)+'%';b.classList.toggle('selected',selected===i);b.setAttribute('aria-label','Case '+(i+1)+', morceau '+(t+1));b.setAttribute('aria-pressed',String(selected===i))});update()}
function update(){let sec=start?Math.floor((Date.now()-start)/1000):0;stats.textContent=moves+' déplacements · '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function swap(a,b){selected=null;if(a===b){render();return}if(!start)start=Date.now();[order[a],order[b]]=[order[b],order[a]];moves++;render();if(order.every((v,i)=>v===i)){done=true;update();message.textContent='Bravo ! Puzzle réussi ! 🎉'}}
function shuffle(){order=Array.from({length:n*n},(_,i)=>i);do{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}while(order.every((v,i)=>v===i));selected=null;source=null;moves=0;start=null;done=false;message.textContent='';render()}
document.getElementById('shuffle').onclick=shuffle;document.getElementById('model').onclick=function(){let p=document.getElementById('preview');p.hidden=!p.hidden;this.textContent=p.hidden?'Afficher le modèle':'Masquer le modèle';this.setAttribute('aria-expanded',String(!p.hidden))};setInterval(()=>{if(!done)update()},1000);shuffle();
